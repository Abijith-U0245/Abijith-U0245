<svg width="160" height="38" viewBox="0 0 160 38" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-now-building" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="border-now-building" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="glow-now-building" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="1" y="1" width="158" height="36" rx="18" fill="url(#bg-now-building)" stroke="url(#border-now-building)" stroke-width="1.5"/>
  <circle cx="20" cy="19" r="4" fill="#818CF8"/>
  <text x="32" y="24" font-family="System-UI, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Now Building</text>
</svg>